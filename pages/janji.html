<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buat Janji Temu - HealthyCare Clinic</title>
    <link rel="stylesheet" href="../src/styles.css" />
  </head>
  <body class="bg-slate-50">
    <header class="bg-white shadow-md">
      <nav class="flex justify-between items-center max-w-[1200px] mx-auto px-5 py-4">
        <div class="text-2xl font-bold text-sky-600">HealthyCare <span class="text-green-600">Clinic</span></div>
        <a href="/index.html" class="text-slate-600 font-medium no-underline hover:text-sky-600 transition-colors duration-300">&larr; Kembali ke Beranda</a>
      </nav>
    </header>

    <main class="py-[60px] px-5">
      <div class="max-w-[600px] mx-auto">
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-slate-900 mb-2.5">Buat Janji Temu</h1>
          <p class="text-slate-500">Isi data di bawah ini untuk membuat janji dengan dokter kami.</p>
        </div>

        <form id="form-janji" class="bg-white p-8 rounded-xl shadow-md border border-slate-200 space-y-5">
          <div>
            <label for="nama" class="block text-sm font-medium text-slate-700 mb-1">Nama Pasien</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500" />
          </div>

          <div>
            <label for="dokter" class="block text-sm font-medium text-slate-700 mb-1">Dokter</label>
            <select id="dokter" name="dokter" required
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white">
              <option value="">-- Pilih dokter --</option>
              <option value="dr. Damar langit">dr. Damar langit (Sp. THT)</option>
              <option value="dr. Raditya Reynald">dr. Raditya Reynald (Sp. Anak)</option>
              <option value="dr. Nadia Elora">dr. Nadia Elora (Sp. Kandungan)</option>
              <option value="dr. Kenzo Pramudya">dr. Kenzo Pramudya (Sp. Mata)</option>
              <option value="dr. Raya Sudiro">dr. Raya Sudiro (Sp. Kulit)</option>
              <option value="dr. Kiara Shafira">dr. Kiara Shafira (Sp. Penyakit Dalam)</option>
            </select>
          </div>

          <div>
            <label for="tanggal" class="block text-sm font-medium text-slate-700 mb-1">Tanggal</label>
            <input type="date" id="tanggal" name="tanggal" required
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500" />
          </div>

          <div>
            <label for="telepon" class="block text-sm font-medium text-slate-700 mb-1">Nomor Telepon</label>
            <input type="tel" id="telepon" name="telepon" placeholder="Contoh: 081234567890" required
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500" />
          </div>

          <div>
            <label for="keluhan" class="block text-sm font-medium text-slate-700 mb-1">Keluhan</label>
            <textarea id="keluhan" name="keluhan" rows="4" placeholder="Ceritakan keluhan Anda" required
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500"></textarea>
          </div>

          <button type="submit"
            class="w-full bg-green-600 text-white py-3 rounded-full font-bold hover:bg-green-700 transition-colors duration-300">
            Kirim Janji Temu
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
